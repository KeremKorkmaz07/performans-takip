<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Performans Takip - Antrenman & 1RM Analizi</title>
    <!-- Tarayıcı Sekmesi ve Ana Ekran Simgesi -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310b981'/%3E%3Cpath d='M34 14L18 36h13l-2 14 16-22H32l2-14z' fill='%2309090b'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2310b981'/%3E%3Cpath d='M96 40L52 102h36l-6 38 44-62H90l6-38z' fill='%2309090b'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#09090b">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        zinc: {
                            850: '#1f1f23',
                            925: '#121215',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Kaydırma çubuğu gizleme (Sekmeler için) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Dokunmatik cihazlarda vurgulama rengini kaldır */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        /* Modal animasyonları */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        .animate-slide-up {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- Üst Bilgi Çubuğu (Header) -->
    <header class="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80">
        <div class="max-w-2xl mx-auto px-4 min-h-16 py-2.5 flex items-center justify-between gap-2">
            <!-- Logo ve Uygulama Adı -->
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="shrink-0 w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <svg class="w-5 h-5 text-zinc-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-lg font-bold tracking-tight text-white leading-tight truncate">Performans Takip</h1>
                    <span class="block text-[11px] font-medium text-zinc-400 leading-tight truncate">1RM & Gelişim Günlüğü</span>
                </div>
            </div>

            <!-- Sağ Aksiyonlar: Birim Geçişi (LBS/KG), Yedekle (Export), Geri Yükle (Import), Sıfırla -->
            <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
                <button id="unitToggleBtn" onclick="toggleDisplayUnit()" title="Görüntüleme Birimini Değiştir (LBS / KG)" class="px-2.5 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 text-xs font-extrabold tracking-wide text-emerald-400 transition active:scale-95">
                    LBS
                </button>
                <button onclick="exportData()" title="Verileri JSON Olarak İndir" class="p-2 sm:p-2.5 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/80 transition active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                </button>
                <label title="JSON Yedeği Yükle" class="p-2 sm:p-2.5 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/80 transition active:scale-95 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="confirmResetData()" title="Örnek Verilere Sıfırla" class="p-2 sm:p-2.5 rounded-xl text-zinc-400 hover:text-rose-400 hover:bg-rose-500/10 transition active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Ana Konteyner -->
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 pt-5 pb-24 flex flex-col gap-5">

        <!-- Profil Seçici Alanı -->
        <section class="bg-zinc-900/90 border border-zinc-800/90 rounded-2xl p-3.5 shadow-sm">
            <div class="flex items-center justify-between mb-2 px-1">
                <label for="profileSelect" class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Aktif Program / Profil</label>
                <button id="deleteProfileBtn" onclick="confirmDeleteProfile()" class="text-xs text-zinc-500 hover:text-rose-400 transition hidden">
                    Profili Sil
                </button>
            </div>
            <div class="flex items-center gap-2.5">
                <div class="relative flex-1">
                    <select id="profileSelect" onchange="switchProfile(this.value)" class="w-full appearance-none bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-white font-semibold text-sm sm:text-base rounded-xl px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition cursor-pointer">
                        <!-- JS ile doldurulacak -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-zinc-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>
                <button onclick="openNewProfileModal()" class="shrink-0 bg-zinc-800 hover:bg-zinc-750 active:scale-95 text-zinc-100 border border-zinc-700/80 font-medium text-sm px-4 py-3 rounded-xl flex items-center gap-1.5 transition">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Yeni Profil</span>
                </button>
            </div>
        </section>

        <!-- Tarayıcı Tarzı Gün Sekmeleri (Browser Tabs) -->
        <section class="flex flex-col">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-0">
                <div id="tabsContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pr-2">
                    <!-- JS ile doldurulacak -->
                </div>
                <div class="flex items-center gap-1 shrink-0 pb-1.5 pl-2 bg-zinc-950">
                    <button onclick="openTabActionModal('add')" title="Yeni Gün/Sekme Ekle" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-zinc-800 transition active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                    </button>
                    <button id="manageTabBtn" onclick="openTabActionModal('edit')" title="Aktif Sekmeyi Düzenle / Sil" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800 transition active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Egzersiz Listesi -->
        <section id="exerciseListSection" class="flex flex-col gap-3">
            <div id="exerciseList" class="flex flex-col gap-3">
                <!-- Egzersiz kartları buraya gelecek -->
            </div>

            <!-- Egzersiz Ekle Butonu -->
            <button id="addExerciseBtn" onclick="openAddExerciseModal()" class="mt-2 w-full py-3.5 px-4 rounded-2xl border-2 border-dashed border-zinc-800 hover:border-emerald-500/50 bg-zinc-900/40 hover:bg-emerald-500/5 text-zinc-300 hover:text-emerald-400 font-semibold text-sm flex items-center justify-center gap-2 transition active:scale-[0.99]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                <span>Egzersiz Ekle</span>
            </button>
        </section>

    </main>

    <!-- Bildirim (Toast) Kutusu -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2"></div>

    <!-- ===================================================================== -->
    <!-- MODALLAR (AÇILIR PENCERELER)                                          -->
    <!-- ===================================================================== -->

    <!-- 1. Hızlı Ağırlık & Tekrar Güncelleme Modalı -->
    <div id="quickEditModal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-slide-up">
            <div class="flex items-start justify-between mb-4">
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Yeni Set Kaydı</span>
                    <h3 id="quickEditTitle" class="text-lg font-bold text-white mt-0.5">Incline Bench Press</h3>
                </div>
                <button onclick="closeModal('quickEditModal')" class="p-2 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <form onsubmit="saveQuickEdit(event)" class="flex flex-col gap-4">
                <!-- Ağırlık Girişi -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs font-medium text-zinc-400">Ağırlık</label>
                        <div class="flex items-center bg-zinc-950 border border-zinc-800 rounded-lg p-0.5">
                            <button type="button" id="quickUnitLbsBtn" onclick="setQuickInputUnit('lbs')" class="px-2.5 py-1 rounded-md text-[11px] font-bold transition">LBS</button>
                            <button type="button" id="quickUnitKgBtn" onclick="setQuickInputUnit('kg')" class="px-2.5 py-1 rounded-md text-[11px] font-bold transition">KG</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full">
                        <button type="button" onclick="adjustInput('editWeightInput', -2.5)" class="shrink-0 w-14 h-12 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-sm font-bold text-rose-400 border border-zinc-700/80 flex items-center justify-center transition">-2.5</button>
                        <input type="number" id="editWeightInput" step="0.1" min="0" required oninput="updateLive1RMPreview()" class="min-w-0 flex-1 w-full h-12 bg-zinc-950 border border-zinc-700 rounded-xl text-center text-xl font-bold text-white focus:outline-none focus:border-emerald-500">
                        <button type="button" onclick="adjustInput('editWeightInput', 5)" class="shrink-0 w-14 h-12 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-base font-bold text-emerald-400 border border-zinc-700/80 flex items-center justify-center transition">+5</button>
                    </div>
                    <div id="quickConversionHint" class="text-[11px] text-zinc-400 mt-1.5 text-right font-medium">
                        Kayıt değeri: 225 lbs
                    </div>
                </div>

                <!-- Tekrar Girişi -->
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1.5">Tekrar Sayısı (Rep)</label>
                    <div class="flex items-center gap-2 w-full">
                        <button type="button" onclick="adjustInput('editRepsInput', -1)" class="shrink-0 w-12 h-12 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-xl font-bold text-rose-400 border border-zinc-700/80 flex items-center justify-center transition">-1</button>
                        <input type="number" id="editRepsInput" step="1" min="1" required oninput="updateLive1RMPreview()" class="min-w-0 flex-1 w-full h-12 bg-zinc-950 border border-zinc-700 rounded-xl text-center text-xl font-bold text-white focus:outline-none focus:border-emerald-500">
                        <button type="button" onclick="adjustInput('editRepsInput', 1)" class="shrink-0 w-12 h-12 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-xl font-bold text-emerald-400 border border-zinc-700/80 flex items-center justify-center transition">+1</button>
                    </div>
                </div>

                <!-- Canlı Tahmini 1RM Önizlemesi -->
                <div class="bg-zinc-950/80 border border-zinc-800/80 rounded-2xl p-3 flex items-center justify-between">
                    <span class="text-xs text-zinc-400">Hesaplanan Tahmini 1RM:</span>
                    <span id="live1RMValue" class="text-base font-extrabold text-emerald-400">285 lbs</span>
                </div>

                <div class="flex items-center gap-2.5 mt-2">
                    <button type="button" onclick="closeModal('quickEditModal')" class="flex-1 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-750 text-zinc-300 font-semibold text-sm transition">İptal</button>
                    <button type="submit" class="flex-1 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition active:scale-95">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 1RM Grafik ve Geçmiş Detay Modalı -->
    <div id="chartModal" class="fixed inset-0 z-40 hidden items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl animate-slide-up overflow-hidden">
            <!-- Modal Üst Kısım -->
            <div class="p-5 border-b border-zinc-800 flex items-center justify-between shrink-0">
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400">Performans Analizi</span>
                    <h3 id="chartModalTitle" class="text-xl font-bold text-white mt-0.5">Egzersiz Adı</h3>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="confirmDeleteExercise()" title="Egzersizi Sil" class="p-2.5 rounded-xl text-zinc-400 hover:text-rose-400 hover:bg-rose-500/10 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                    <button onclick="closeModal('chartModal')" class="p-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-800 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- Kaydırılabilir İçerik -->
            <div class="p-5 overflow-y-auto flex-1 flex flex-col gap-5">
                <!-- Özet İstatistik Kartları -->
                <div class="grid grid-cols-3 gap-2.5">
                    <div class="bg-zinc-950 border border-zinc-800/90 rounded-2xl p-3">
                        <span class="block text-[11px] font-medium text-zinc-400">En İyi 1RM</span>
                        <span id="statBest1RM" class="text-base sm:text-lg font-extrabold text-emerald-400 mt-0.5 block">0 kg</span>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800/90 rounded-2xl p-3">
                        <span class="block text-[11px] font-medium text-zinc-400">Son Performans</span>
                        <span id="statLatest" class="text-base sm:text-lg font-bold text-white mt-0.5 block">0x0</span>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800/90 rounded-2xl p-3">
                        <span class="block text-[11px] font-medium text-zinc-400">Toplam Kayıt</span>
                        <span id="statCount" class="text-base sm:text-lg font-bold text-indigo-400 mt-0.5 block">0</span>
                    </div>
                </div>

                <!-- Chart.js Grafik Alanı -->
                <div class="bg-zinc-950 border border-zinc-800/90 rounded-2xl p-3.5">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold text-zinc-300">Tahmini 1RM Gelişim Grafiği</span>
                        <span class="text-[11px] text-zinc-500">Formül: W × (1 + 0.0333 × R)</span>
                    </div>
                    <div class="relative h-52 w-full">
                        <canvas id="progressionChart"></canvas>
                    </div>
                </div>

                <!-- Geçmiş Kayıtlar Listesi -->
                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2
